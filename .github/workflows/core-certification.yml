name: Klynge Core Certification

on:
  pull_request:
  push:
    branches:
      - main
      - claude/amazing-davinci-39fqur

permissions:
  contents: read

concurrency:
  group: klynge-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Deterministic engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Install Chromium for landing QA
        run: npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Run landing QA with installed Playwright Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
        run: |
          npx --yes playwright@1.56.1 install chromium
          npm run qa

  workflow-postgres:
    name: Workflow OS isolated PostgreSQL and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install PostgreSQL binaries
        run: sudo apt-get update && sudo apt-get install -y postgresql
      - run: npm ci
      - name: Certify migrations and local PostgreSQL workflow controls
        run: npm run test:rls

  app:
    name: Subscriber app static and unit gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build production subscriber app
        run: npm run build
      - run: npm run bundle:check
      - name: Install Chromium for isolated browser E2E
        run: npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Execute mock-mode browser journeys
        run: npm run e2e

# These gates deliberately do not certify hosted data providers, licensed feeds,
# hosted Supabase RLS, real-provider journeys, email delivery, billing, or production deployment.
# Browser E2E is isolated mock-mode only; never interpret it as live certification.
# Those require separately authorized, environment-specific certification.
